name: Publish to PyPI

on:
  push:
    branches: [master]

# Queue instead of cancel: a run cancelled mid-upload leaves a half-published release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Check if version needs publishing
        id: check
        run: |
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(grep -oP '(?<=__version__ = ")[^"]+' bolna/__init__.py)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$LATEST_TAG" | sort -V | tail -1)
          # An untagged commit whose version is not above the latest tag still carries unreleased
          # code: two PRs bumped from the same tag, or a fork PR the bump workflow cannot push to.
          if [ "$VERSION" != "$HIGHEST" ] || [ "$VERSION" = "$LATEST_TAG" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<<"$LATEST_TAG"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" bolna/__init__.py
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
